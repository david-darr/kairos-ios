name: TestFlight

# Builds a signed release and uploads it to App Store Connect for TestFlight.
# Started by hand only, and only from main. It never runs for pull requests,
# so code from a fork can never see the signing secrets.
#
# Secrets it needs (Settings > Secrets and variables > Actions):
#   ASC_KEY_P8        the App Store Connect API key file's text
#   ASC_KEY_ID        that key's Key ID
#   ASC_ISSUER_ID     the App Store Connect Issuer ID
#   DIST_P12_BASE64   the Apple Distribution certificate and its private key (.p12), base64
#   DIST_P12_PASSWORD the password of that .p12
#   PROFILE_BASE64    the App Store provisioning profile for the app, base64
#   WIDGET_PROFILE_BASE64  the App Store provisioning profile for the widget and Live Activity
#                     extension (app.kairos-agents.mobile.liveactivity), base64
#
# The upload build is the app with its widget extension inside (project-widgets.yml).
# Each target signs with its own profile.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    if: github.repository == 'david-darr/kairos-ios' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      BUNDLE_ID: app.kairos-agents.mobile
      WIDGET_BUNDLE_ID: app.kairos-agents.mobile.liveactivity
      APP_GROUP: group.app.kairos-agents.mobile
    steps:
      - uses: actions/checkout@v4

      - name: Paths
        run: |
          {
            echo "ARCHIVE=$RUNNER_TEMP/KairosAgents.xcarchive"
            echo "EXPORT_DIR=$RUNNER_TEMP/export"
            echo "KEYCHAIN=$RUNNER_TEMP/signing.keychain-db"
          } >> "$GITHUB_ENV"

      - name: Check the secrets are set
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROFILE_BASE64 }}
          WIDGET_PROFILE_BASE64: ${{ secrets.WIDGET_PROFILE_BASE64 }}
        run: |
          missing=0
          for name in ASC_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID DIST_P12_BASE64 DIST_P12_PASSWORD PROFILE_BASE64 WIDGET_PROFILE_BASE64; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set"; missing=1; fi
          done
          exit $missing

      - name: Fonts
        run: |
          python3 -m venv "$RUNNER_TEMP/fontenv"
          "$RUNNER_TEMP/fontenv/bin/pip" install --quiet fonttools==4.57.0 brotli==1.1.0
          "$RUNNER_TEMP/fontenv/bin/python" Tools/build_fonts.py

      - name: Generate the Xcode project (the app and its widget extension)
        run: |
          which xcodegen || brew install xcodegen
          xcodegen generate --spec project-widgets.yml

      - name: Install the certificate and both profiles
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROFILE_BASE64 }}
          WIDGET_PROFILE_BASE64: ${{ secrets.WIDGET_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "Signing identities: $(security find-identity -v -p codesigning "$KEYCHAIN" | grep -c 'Apple Distribution' || true)"

          # install_profile <base64> <file name>: decode a profile, put it where Xcode looks, print its name.
          install_profile() {
            echo "$1" | base64 --decode > "$RUNNER_TEMP/$2.mobileprovision"
            security cms -D -i "$RUNNER_TEMP/$2.mobileprovision" > "$RUNNER_TEMP/$2.plist"
            local uuid
            uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/$2.plist")
            for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              mkdir -p "$dir"
              cp "$RUNNER_TEMP/$2.mobileprovision" "$dir/$uuid.mobileprovision"
            done
            echo "Profile $2: $(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/$2.plist") (expires $(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$RUNNER_TEMP/$2.plist"))" >&2
          }
          install_profile "$PROFILE_BASE64" app
          install_profile "$WIDGET_PROFILE_BASE64" widget
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/app.plist")
          WIDGET_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/widget.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/app.plist")
          echo "::add-mask::$TEAM_ID"

          # Each profile must allow what its target asks for (project-widgets.yml, entitlements).
          # Names the first thing missing, so a profile made before a capability was turned on is easy to spot.
          needs() {
            if ! /usr/libexec/PlistBuddy -c "Print :Entitlements:$2" "$RUNNER_TEMP/$1.plist" > "$RUNNER_TEMP/$1-value.txt" 2>/dev/null; then
              echo "::error::The $1 profile does not allow $2. Turn it on for that App ID in the Apple developer portal, make a new App Store profile and replace its secret."
              exit 1
            fi
          }
          needs app aps-environment
          needs app com.apple.developer.usernotifications.time-sensitive
          needs app com.apple.developer.usernotifications.communication
          needs app com.apple.security.application-groups
          grep -q "$APP_GROUP" "$RUNNER_TEMP/app-value.txt" || { echo "::error::The app profile does not include the app group $APP_GROUP."; exit 1; }
          needs widget com.apple.security.application-groups
          grep -q "$APP_GROUP" "$RUNNER_TEMP/widget-value.txt" || { echo "::error::The widget profile does not include the app group $APP_GROUP."; exit 1; }
          {
            echo "PROFILE_NAME=$PROFILE_NAME"
            echo "WIDGET_PROFILE_NAME=$WIDGET_PROFILE_NAME"
            echo "TEAM_ID=$TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Push for the App Store
        run: |
          # The entitlements file in git says development (simulator and debug builds); a store build
          # must say production, as its profile does.
          /usr/libexec/PlistBuddy -c 'Set :aps-environment production' KairosWidgets/Support/KairosAgents.entitlements
          /usr/libexec/PlistBuddy -c 'Print :aps-environment' KairosWidgets/Support/KairosAgents.entitlements

      - name: Archive
        run: |
          set -o pipefail
          if ! xcodebuild archive \
            -project KairosAgents.xcodeproj \
            -scheme KairosAgents \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            KAIROS_APP_PROFILE="$PROFILE_NAME" \
            KAIROS_WIDGET_PROFILE="$WIDGET_PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            > archive.log 2>&1; then
            grep -E "error:" -A 6 archive.log | head -300
            tail -40 archive.log
            exit 1
          fi
          echo "Archived build ${{ github.run_number }}"

      - name: Export the app
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
              <key>$WIDGET_BUNDLE_ID</key><string>$WIDGET_PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          if ! xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$EXPORT_DIR" \
            > export.log 2>&1; then
            grep -E "error" -A 6 export.log | head -200
            tail -40 export.log
            exit 1
          fi
          ls -la "$EXPORT_DIR"

      - name: Upload to App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          IPA=$(ls "$EXPORT_DIR"/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee upload.log
          if grep -qiE "error|failed" upload.log && ! grep -qi "No errors uploading" upload.log; then
            echo "::error::The upload reported a problem"
            exit 1
          fi
          echo "Build ${{ github.run_number }} is uploaded. It shows in TestFlight after Apple finishes processing it."

      - name: Clean up
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -rf "$HOME/.appstoreconnect/private_keys" "$RUNNER_TEMP"/*.mobileprovision "$RUNNER_TEMP"/*.plist "$RUNNER_TEMP"/*-value.txt
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"/*.mobileprovision
